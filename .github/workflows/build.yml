name: Build NAStool Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
      - LICENSE.md

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release version
        run: |
          app_version=$(sed -ne "s/^APP_VERSION[[:space:]]*=[[:space:]]*'v\(.*\)'.*/\1/p" version.py)
          echo "app_version=${app_version}" >> $GITHUB_ENV

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nastool:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nastool:${{ env.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update DockerHub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/nastool
          short-description: 2.9的第三方维护版本，持续修复登录下载一系列问题
          readme-filepath: README.md
